<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaltrix</title>
    <script>
      // Apply the saved theme before the page paints, to avoid a flash of the wrong colours.
      try { if (localStorage.getItem("scaltrix-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
